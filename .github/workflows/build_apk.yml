name: Build Android APK (Flutter)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flutter Project & Build APK
        run: |
          # যদি ফাইলগুলো সাব-ফোল্ডারে থাকে তবে সেটিকে রুটে নিয়ে আসা
          if [ -f "EPS_Learning_Flutter_App/pubspec.yaml" ]; then
            cp -r EPS_Learning_Flutter_App/* .
          fi

          # আমাদের কাস্টম lib ফোল্ডার ও pubspec ব্যাকআপ রাখা
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml

          # ফ্রেশ অ্যান্ড্রয়েড প্ল্যাটফর্ম ফাইল তৈরি করা
          flutter create --platforms=android --org com.mdbanna --project-name eps_topik_bangla .

          # আমাদের আসল কোড ও প্যাকেজ লিস্ট ফিরিয়ে আনা
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

          # ডিপেন্ডেন্সি ইনস্টল ও রিলিজ APK বিল্ড করা
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPS-TOPIK-Bangla-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
