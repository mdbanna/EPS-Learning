name: Build Android APK (Flutter)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Clean Flutter Project & Build APK
        run: |
          # ১. রিপোজিটরির যেকোনো ফোল্ডার থেকে আমাদের lib ফোল্ডারটি খুঁজে ব্যাকআপ নেওয়া
          MAIN_FILE=$(find . -name "main.dart" | head -n 1)
          if [ -z "$MAIN_FILE" ]; then
            echo "Error: main.dart খুঁজে পাওয়া যায়নি!"
            exit 1
          fi
          LIB_DIR=$(dirname "$MAIN_FILE")
          cp -r "$LIB_DIR" /tmp/custom_lib

          # ২. সম্পূর্ণ নতুন ও পরিষ্কার একটি Flutter প্রজেক্ট তৈরি করা
          mkdir /tmp/clean_app
          cd /tmp/clean_app
          flutter create --platforms=android --org com.mdbanna --project-name eps_topik_bangla .

          # ৩. ডিফল্ট টেস্ট ফাইল মুছে আমাদের আসল lib ফোল্ডার বসানো
          rm -rf lib test
          cp -r /tmp/custom_lib ./lib

          # ৪. কোনো থার্ড-পার্টি প্যাকেজ কনফ্লিক্ট ছাড়াই ক্লিন pubspec.yaml তৈরি করা
          cat << 'EOF' > pubspec.yaml
          name: eps_topik_bangla
          description: EPS-TOPIK Bangla Learning App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          # ৫. ডিপেন্ডেন্সি সেটআপ ও সরাসরি Release APK বিল্ড করা
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPS-TOPIK-Bangla-App-APK
          path: /tmp/clean_app/build/app/outputs/flutter-apk/app-release.apk
